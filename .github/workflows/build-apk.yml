              void syncNow() {
                  final String ip = get("mt_ip", "");
                  if (ip.isEmpty()) {
                      toast("Isi Pengaturan MikroTik dulu");
                      return;
                  }

                  toast("Sinkronisasi dimulai...");

                  new Thread(() -> {
                      RouterApi api = null;
                      try {
                          api = new RouterApi(
                              ip,
                              Integer.parseInt(get("mt_port", "8728")),
                              get("mt_user", ""),
                              get("mt_pass", "")
                          );

                          api.login();

                          List<Map<String, String>> secrets =
                              api.print("/ppp/secret/print");
                          List<Map<String, String>> active =
                              api.print("/ppp/active/print");

                          api.close();
                          api = null;

                          HashSet<String> online = new HashSet<>();
                          for (Map<String, String> a : active) {
                              String n = a.get("name");
                              if (n != null) online.add(n);
                          }

                          int added = 0;
                          int updated = 0;

                          for (Map<String, String> s : secrets) {
                              String name = s.get("name");
                              if (name == null || name.isEmpty()) continue;

                              String profile = s.get("profile");
                              int idx = findCustomer(name);

                              if (idx < 0) {
                                  idx = prefs.getInt("count", 0);

                                  prefs.edit()
                                      .putString("c_" + idx + "_name", name)
                                      .putString("c_" + idx + "_wa", "")
                                      .putString("c_" + idx + "_ppp", name)
                                      .putString(
                                          "c_" + idx + "_pack",
                                          profile == null ? "" : profile
                                      )
                                      .putString("c_" + idx + "_amount", "0")
                                      .putString("c_" + idx + "_due", "-")
                                      .putString(
                                          "c_" + idx + "_online",
                                          online.contains(name) ? "1" : "0"
                                      )
                                      .putString("c_" + idx + "_paid", "0")
                                      .putInt("count", idx + 1)
                                      .apply();

                                  added++;
                              } else {
                                  prefs.edit()
                                      .putString(
                                          "c_" + idx + "_pack",
                                          profile == null ? "" : profile
                                      )
                                      .putString(
                                          "c_" + idx + "_online",
                                          online.contains(name) ? "1" : "0"
                                      )
                                      .apply();

                                  updated++;
                              }
                          }

                          final int a = added;
                          final int b = updated;

                          runOnUiThread(() -> {
                              toast("Sinkronisasi selesai. Baru: " + a + " | Update: " + b);
                              showHome();
                          });
                      } catch (Exception e) {
                          if (api != null) api.close();
                          runOnUiThread(() ->
                              toast("Sinkronisasi gagal: " + e.getMessage())
                          );
                      }
                  }).start();
              }

              int findCustomer(String ppp) {
                  int c = prefs.getInt("count", 0);
                  for (int i = 0; i < c; i++) {
                      if (ppp.equals(get("c_" + i + "_ppp", ""))) {
                          return i;
                      }
                  }
                  return -1;
              }

