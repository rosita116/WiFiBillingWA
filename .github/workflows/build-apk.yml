              void ui6BottomNav(LinearLayout rootLayout, int active) {
                  LinearLayout nav = new LinearLayout(this);
                  nav.setGravity(Gravity.CENTER);
                  nav.setPadding(4, 5, 4, 5);
                  nav.setBackgroundColor(Color.WHITE);

                  String[] icons = {"⌂", "♙", "▣", "⌁", "⚙"};
                  String[] labels = {"Dashboard", "Pelanggan", "Tagihan", "MikroTik", "Pengaturan"};

                  for (int i = 0; i < 5; i++) {
                      final int ix = i;
                      LinearLayout item = new LinearLayout(this);
                      item.setOrientation(LinearLayout.VERTICAL);
                      item.setGravity(Gravity.CENTER);
                      int color = (i == active) ? 0xff5b2dcc : 0xff858099;

                      TextView ic = ui6Text(icons[i], 20, color, true);
                      ic.setGravity(Gravity.CENTER);
                      item.addView(ic, new LinearLayout.LayoutParams(-1, 26));

                      TextView tx = ui6Text(labels[i], 9, color, i == active);
                      tx.setGravity(Gravity.CENTER);
                      item.addView(tx, new LinearLayout.LayoutParams(-1, 20));

                      item.setOnClickListener(v -> {
                          if (ix == 0) showHome();
                          else if (ix == 1) showCustomers();
                          else if (ix == 2) showBilling();
                          else if (ix == 3) showSettings();
                          else showSettings();
                      });

                      nav.addView(item, new LinearLayout.LayoutParams(0, 54, 1));
                  }

                  rootLayout.addView(nav, new LinearLayout.LayoutParams(-1, 60));
              }

              String ui6Money(long n) {
                  String s = Long.toString(Math.max(0, n));
                  StringBuilder b = new StringBuilder();
                  int c = 0;
                  for (int i = s.length() - 1; i >= 0; i--) {
                      b.insert(0, s.charAt(i));
                      if (++c == 3 && i > 0) {
                          b.insert(0, '.');
                          c = 0;
                      }
                  }
                  return b.toString();
              }


              void showIsolir() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xfff6f3fc);

                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(16, 10, 16, 12);

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  TextView back = ui7Text("‹", 34, 0xff3b247e, false);
                  back.setGravity(Gravity.CENTER);
                  back.setOnClickListener(v -> showHome());
                  header.addView(back, new LinearLayout.LayoutParams(48, 54));

                  LinearLayout ht = new LinearLayout(this);
                  ht.setOrientation(LinearLayout.VERTICAL);
                  ht.addView(ui7Text("Isolir Pelanggan", 21, 0xff24204b, true));
                  ht.addView(ui7Text("Blokir / Unblock PPPoE", 11, 0xff77738c, false));
                  header.addView(ht, new LinearLayout.LayoutParams(0, -2, 1));
                  page.addView(header);

                  LinearLayout info = ui7Card();
                  info.setPadding(14, 14, 14, 14);
                  info.addView(ui7Text(
                      "Isolir menggunakan PPP Secret MikroTik. " +
                      "Saat aktif, pelanggan diblokir dan sesi PPP aktif dihentikan.",
                      12, 0xff5f5a70, false
                  ));
                  page.addView(info);
                  ui7Gap(page, 10);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout isolationList = new LinearLayout(this);
                  isolationList.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(isolationList);
                  page.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));

                  int count = prefs.getInt("count", 0);
                  if (count == 0) {
                      isolationList.addView(ui7Text(
                          "Belum ada pelanggan.", 16, 0xff77738c, false
                      ));
                  }

                  for (int i = 0; i < count; i++) {
                      final int index = i;
                      String name = get("c_" + i + "_name", "");
                      String ppp = get("c_" + i + "_ppp", name);
                      if (name.isEmpty()) continue;

                      LinearLayout card = ui7Card();
                      card.setPadding(14, 12, 14, 12);

                      LinearLayout row = new LinearLayout(this);
