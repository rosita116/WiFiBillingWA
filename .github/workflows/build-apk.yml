name: Build WiFi Billing APK v5 MikroTik

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/wifibilling/wa
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WiFiBillingWA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.wifibilling.wa'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.wifibilling.wa'
                  minSdk 23
                  targetSdk 34
                  versionCode 5
                  versionName '5.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="WiFi Billing WA"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/wifibilling/wa/MainActivity.java <<'EOF'
          package com.wifibilling.wa;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout root, list;
              SharedPreferences prefs;
              Handler handler = new Handler(Looper.getMainLooper());
              Runnable autoSync;

              String get(String k, String d) {
                  return prefs.getString(k, d);
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("billing", MODE_PRIVATE);
                  showHome();
              }

              TextView title(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.DKGRAY);
                  t.setPadding(20, 20, 20, 20);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  return b;
              }

              void base(String heading) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16, 16, 16, 16);
                  root.addView(title(heading, 26));
                  setContentView(root);
              }

              void showHome() {
                  base("WiFi Billing WA");

                  int count = prefs.getInt("count", 0);
                  int online = 0;
                  int paid = 0;
                  for (int i = 0; i < count; i++) {
                      if ("1".equals(get("c_" + i + "_online", "0"))) online++;
                      if ("1".equals(get("c_" + i + "_paid", "0"))) paid++;
                  }

                  LinearLayout cards = new LinearLayout(this);
                  cards.setOrientation(LinearLayout.VERTICAL);
                  cards.addView(title(
                      "Pelanggan: " + count +
                      "    |    Online: " + online +
                      "    |    Offline: " + (count - online) +
                      "\nLunas: " + paid +
                      "    |    Belum bayar: " + (count - paid),
                      17
                  ));
                  root.addView(cards);

                  Button sync = btn("🔄 SINKRONISASI MIKROTIK");
                  root.addView(sync);
                  sync.setOnClickListener(v -> syncNow());

                  Button customers = btn("👥 DAFTAR PELANGGAN");
                  root.addView(customers);
                  customers.setOnClickListener(v -> showCustomers());

                  Button add = btn("➕ TAMBAH PELANGGAN");
                  root.addView(add);
                  add.setOnClickListener(v -> addCustomer());

                  Button billing = btn("💰 PENAGIHAN");
                  root.addView(billing);
                  billing.setOnClickListener(v -> showBilling());

                  Button settings = btn("⚙ PENGATURAN MIKROTIK");
                  root.addView(settings);
                  settings.setOnClickListener(v -> showSettings());

                  root.addView(title(
                      "MikroTik: " +
                      (get("mt_ip", "").isEmpty() ? "Belum dikonfigurasi" : get("mt_ip", "")) +
                      "\nHP harus berada di jaringan yang dapat mengakses MikroTik. " +
                      "Jangan membuka API 8728 ke Internet umum.",
                      14
                  ));
              }

              void showSettings() {
                  base("Pengaturan MikroTik");

                  EditText ip = field("IP MikroTik", get("mt_ip", "10.20.20.1"));
                  EditText port = field("Port API", get("mt_port", "8728"));
                  EditText user = field("Username API", get("mt_user", "billingapi"));
                  EditText pass = field("Password API", "");
                  pass.setInputType(129);

                  root.addView(ip);
                  root.addView(port);
                  root.addView(user);
                  root.addView(pass);

                  Button save = btn("💾 SIMPAN & TES KONEKSI");
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      String host = ip.getText().toString().trim();
                      String p = port.getText().toString().trim();
                      String u = user.getText().toString().trim();
                      String pw = pass.getText().toString();

                      if (host.isEmpty() || p.isEmpty() || u.isEmpty()) {
                          toast("IP, port, dan username wajib diisi");
                          return;
                      }

                      prefs.edit()
                          .putString("mt_ip", host)
                          .putString("mt_port", p)
                          .putString("mt_user", u)
                          .apply();

                      if (!pw.isEmpty()) {
                          prefs.edit().putString("mt_pass", pw).apply();
                      }

                      new Thread(() -> {
                          try {
                              RouterApi api = new RouterApi(
                                  host,
                                  Integer.parseInt(p),
                                  u,
                                  get("mt_pass", "")
                              );
                              api.login();
                              api.close();
                              runOnUiThread(() -> toast("Koneksi MikroTik BERHASIL"));
                          } catch (Exception e) {
                              runOnUiThread(() -> toast("Gagal koneksi: " + e.getMessage()));
                          }
                      }).start();
                  });

                  Button sync = btn("🔄 SINKRONISASI SEKARANG");
                  root.addView(sync);
                  sync.setOnClickListener(v -> syncNow());

                  Button back = btn("← KEMBALI");
                  root.addView(back);
                  back.setOnClickListener(v -> showHome());
              }

              EditText field(String hint, String value) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setTextSize(17);
                  e.setPadding(12, 12, 12, 12);
                  return e;
              }

              void addCustomer() {
                  base("Tambah Pelanggan");

                  EditText name = field("Nama pelanggan", "");
                  EditText wa = field("WhatsApp", "");
                  EditText ppp = field("Username PPPoE", "");
                  EditText pack = field("Paket / Profile", "");
                  EditText amount = field("Tagihan", "");
                  EditText due = field("Jatuh tempo", "");

                  root.addView(name);
                  root.addView(wa);
                  root.addView(ppp);
                  root.addView(pack);
                  root.addView(amount);
                  root.addView(due);

                  Button save = btn("💾 SIMPAN");
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      String n = name.getText().toString().trim();
                      String u = ppp.getText().toString().trim();

                      if (n.isEmpty() || u.isEmpty()) {
                          toast("Nama dan username PPPoE wajib diisi");
                          return;
                      }

                      if (findCustomer(u) >= 0) {
                          toast("Username PPPoE sudah ada");
                          return;
                      }

                      int count = prefs.getInt("count", 0);
                      prefs.edit()
                          .putString("c_" + count + "_name", n)
                          .putString("c_" + count + "_wa", wa.getText().toString().trim())
                          .putString("c_" + count + "_ppp", u)
                          .putString("c_" + count + "_pack", pack.getText().toString().trim())
                          .putString("c_" + count + "_amount", amount.getText().toString().trim())
                          .putString("c_" + count + "_due", due.getText().toString().trim())
                          .putString("c_" + count + "_online", "0")
                          .putString("c_" + count + "_paid", "0")
                          .putInt("count", count + 1)
                          .apply();

                      toast("Pelanggan disimpan");
                      showCustomers();
                  });

                  Button back = btn("← KEMBALI");
                  root.addView(back);
                  back.setOnClickListener(v -> showHome());
              }

              void showCustomers() {
                  base("Daftar Pelanggan");

                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);

                  ScrollView sv = new ScrollView(this);
                  sv.addView(list);
                  root.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));

                  int count = prefs.getInt("count", 0);
                  if (count == 0) {
                      list.addView(title("Belum ada pelanggan.", 18));
                  }

                  for (int i = 0; i < count; i++) {
                      final int index = i;

                      String n = get("c_" + i + "_name", "");
                      String p = get("c_" + i + "_ppp", "");
                      String pack = get("c_" + i + "_pack", "");
                      String amount = get("c_" + i + "_amount", "0");
                      String due = get("c_" + i + "_due", "-");
                      String online = get("c_" + i + "_online", "0");
                      String paid = get("c_" + i + "_paid", "0");

                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(12, 12, 12, 12);
                      card.setBackgroundColor(0xffeeeeee);

                      TextView info = title(
                          n +
                          "\nPPPoE: " + p +
                          "\nPaket: " + pack +
                          "\nTagihan: Rp " + amount +
                          "\nJatuh tempo: " + due +
                          "\nStatus: " + ("1".equals(online) ? "ONLINE" : "OFFLINE") +
                          " | " + ("1".equals(paid) ? "LUNAS" : "BELUM BAYAR"),
                          17
                      );
                      card.addView(info);

                      Button edit = btn("✏️ EDIT");
                      card.addView(edit);
                      edit.setOnClickListener(v -> showEditCustomer(index));

                      list.addView(card);

                      LinearLayout.LayoutParams lp =
                          (LinearLayout.LayoutParams) card.getLayoutParams();
                      if (lp != null) {
                          lp.setMargins(0, 0, 0, 12);
                          card.setLayoutParams(lp);
                      }
                  }

                  Button back = btn("← KEMBALI");
                  root.addView(back);
                  back.setOnClickListener(v -> showHome());
              }

              void showEditCustomer(int index) {
                  base("Edit Pelanggan");

                  EditText name = field("Nama pelanggan",
                      get("c_" + index + "_name", ""));
                  EditText wa = field("WhatsApp",
                      get("c_" + index + "_wa", ""));
                  EditText ppp = field("Username PPPoE",
                      get("c_" + index + "_ppp", ""));
                  EditText pack = field("Paket / Profile",
                      get("c_" + index + "_pack", ""));
                  EditText amount = field("Tagihan",
                      get("c_" + index + "_amount", ""));
                  EditText due = field("Jatuh tempo",
                      get("c_" + index + "_due", ""));

                  root.addView(name);
                  root.addView(wa);
                  root.addView(ppp);
                  root.addView(pack);
                  root.addView(amount);
                  root.addView(due);

                  Button save = btn("💾 SIMPAN PERUBAHAN");
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      String n = name.getText().toString().trim();
                      String u = ppp.getText().toString().trim();

                      if (n.isEmpty() || u.isEmpty()) {
                          toast("Nama dan username PPPoE wajib diisi");
                          return;
                      }

                      int other = findCustomer(u);
                      if (other >= 0 && other != index) {
                          toast("Username PPPoE sudah dipakai pelanggan lain");
                          return;
                      }

                      prefs.edit()
                          .putString("c_" + index + "_name", n)
                          .putString("c_" + index + "_wa", wa.getText().toString().trim())
                          .putString("c_" + index + "_ppp", u)
                          .putString("c_" + index + "_pack", pack.getText().toString().trim())
                          .putString("c_" + index + "_amount", amount.getText().toString().trim())
                          .putString("c_" + index + "_due", due.getText().toString().trim())
                          .apply();

                      toast("Pelanggan diperbarui");
                      showCustomers();
                  });

                  Button back = btn("← KEMBALI");
                  root.addView(back);
                  back.setOnClickListener(v -> showCustomers());
              }

              void showBilling() {
                  base("Penagihan");

                  int count = prefs.getInt("count", 0);

                  ScrollView sv = new ScrollView(this);
                  LinearLayout billingList = new LinearLayout(this);
                  billingList.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(billingList);
                  root.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));

                  if (count == 0) {
                      billingList.addView(title("Belum ada pelanggan.", 18));
                  }

                  for (int i = 0; i < count; i++) {
                      final int index = i;

                      String name = get("c_" + i + "_name", "");
                      String ppp = get("c_" + i + "_ppp", "");
                      String wa = get("c_" + i + "_wa", "");
                      String amount = get("c_" + i + "_amount", "0");
                      String due = get("c_" + i + "_due", "-");
                      String paid = get("c_" + i + "_paid", "0");

                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.VERTICAL);
                      card.setPadding(12, 12, 12, 12);
                      card.setBackgroundColor(0xffeeeeee);

                      TextView info = title(
                          name +
                          "\nPPPoE: " + ppp +
                          "\nTagihan: Rp " + amount +
                          "\nJatuh tempo: " + due +
                          "\nStatus: " + ("1".equals(paid) ? "LUNAS" : "BELUM BAYAR"),
                          17
                      );
                      card.addView(info);

                      Button whatsapp = btn("📱 TAGIH VIA WHATSAPP");
                      card.addView(whatsapp);
                      whatsapp.setOnClickListener(v -> {
                          if (wa.isEmpty()) {
                              toast("Nomor WhatsApp belum diisi");
                              return;
                          }

                          String number = wa.replaceAll("[^0-9]", "");
                          if (number.startsWith("0")) {
                              number = "62" + number.substring(1);
                          }

                          String message =
                              "Halo " + name + ",\n\n" +
                              "Tagihan WiFi Anda:\n" +
                              "PPPoE: " + ppp + "\n" +
                              "Tagihan: Rp " + amount + "\n" +
                              "Jatuh tempo: " + due + "\n\n" +
                              "Mohon melakukan pembayaran. Terima kasih.";

                          try {
                              Intent intent = new Intent(
                                  Intent.ACTION_VIEW,
                                  Uri.parse(
                                      "https://wa.me/" + number +
                                      "?text=" + Uri.encode(message)
                                  )
                              );
                              startActivity(intent);
                          } catch (Exception e) {
                              toast("WhatsApp tidak dapat dibuka");
                          }
                      });

                      Button toggle = btn(
                          "1".equals(paid) ? "↩ BELUM BAYAR" : "✓ TANDAI LUNAS"
                      );
                      card.addView(toggle);
                      toggle.setOnClickListener(v -> {
                          boolean nowPaid =
                              "1".equals(get("c_" + index + "_paid", "0"));
                          prefs.edit()
                              .putString(
                                  "c_" + index + "_paid",
                                  nowPaid ? "0" : "1"
                              )
                              .apply();
                          showBilling();
                      });

                      billingList.addView(card);

                      LinearLayout.LayoutParams lp =
                          (LinearLayout.LayoutParams) card.getLayoutParams();
                      if (lp != null) {
                          lp.setMargins(0, 0, 0, 12);
                          card.setLayoutParams(lp);
                      }
                  }

                  Button back = btn("← KEMBALI");
                  root.addView(back);
                  back.setOnClickListener(v -> showHome());
              }

              void syncNow() {
                  final String ip = get("mt_ip", "");
                  if (ip.isEmpty()) {
                      toast("Isi Pengaturan MikroTik dulu");
                      return;
                  }

                  toast("Sinkronisasi dimulai...");

                  new Thread(() -> {
                      RouterApi api = null;
                      try {
                          api = new RouterApi(
                              ip,
                              Integer.parseInt(get("mt_port", "8728")),
                              get("mt_user", ""),
                              get("mt_pass", "")
                          );

                          api.login();

                          List<Map<String, String>> secrets =
                              api.print("/ppp/secret/print");
                          List<Map<String, String>> active =
                              api.print("/ppp/active/print");

                          api.close();
                          api = null;

                          HashSet<String> online = new HashSet<>();
                          for (Map<String, String> a : active) {
                              String n = a.get("name");
                              if (n != null) online.add(n);
                          }

                          int added = 0;
                          int updated = 0;

                          for (Map<String, String> s : secrets) {
                              String name = s.get("name");
                              if (name == null || name.isEmpty()) continue;

                              String profile = s.get("profile");
                              int idx = findCustomer(name);

                              if (idx < 0) {
                                  idx = prefs.getInt("count", 0);

                                  prefs.edit()
                                      .putString("c_" + idx + "_name", name)
                                      .putString("c_" + idx + "_wa", "")
                                      .putString("c_" + idx + "_ppp", name)
                                      .putString(
                                          "c_" + idx + "_pack",
                                          profile == null ? "" : profile
                                      )
                                      .putString("c_" + idx + "_amount", "0")
                                      .putString("c_" + idx + "_due", "-")
                                      .putString(
                                          "c_" + idx + "_online",
                                          online.contains(name) ? "1" : "0"
                                      )
                                      .putString("c_" + idx + "_paid", "0")
                                      .putInt("count", idx + 1)
                                      .apply();

                                  added++;
                              } else {
                                  prefs.edit()
                                      .putString(
                                          "c_" + idx + "_pack",
                                          profile == null ? "" : profile
                                      )
                                      .putString(
                                          "c_" + idx + "_online",
                                          online.contains(name) ? "1" : "0"
                                      )
                                      .apply();

                                  updated++;
                              }
                          }

                          final int a = added;
                          final int b = updated;

                          runOnUiThread(() -> {
                              toast("Sinkronisasi selesai. Baru: " + a + " | Update: " + b);
                              showHome();
                          });
                      } catch (Exception e) {
                          if (api != null) api.close();
                          runOnUiThread(() ->
                              toast("Sinkronisasi gagal: " + e.getMessage())
                          );
                      }
                  }).start();
              }

              int findCustomer(String ppp) {
                  int c = prefs.getInt("count", 0);
                  for (int i = 0; i < c; i++) {
                      if (ppp.equals(get("c_" + i + "_ppp", ""))) {
                          return i;
                      }
                  }
                  return -1;
              }

              void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show();
              }

              @Override protected void onResume() {
                  super.onResume();

                  if (!get("mt_ip", "").isEmpty()) {
                      if (autoSync != null) handler.removeCallbacks(autoSync);

                      autoSync = new Runnable() {
                          @Override public void run() {
                              syncNow();
                              handler.postDelayed(this, 900000);
                          }
                      };

                      handler.postDelayed(autoSync, 900000);
                  }
              }

              @Override protected void onPause() {
                  super.onPause();
                  if (autoSync != null) {
                      handler.removeCallbacks(autoSync);
                  }
              }

              static class RouterApi {
                  Socket socket;
                  InputStream in;
                  OutputStream out;
                  String host, user, pass;
                  int port;

                  RouterApi(String h, int p, String u, String pw) {
                      host = h;
                      port = p;
                      user = u;
                      pass = pw;
                  }

                  void connect() throws Exception {
                      socket = new Socket();
                      socket.connect(
                          new InetSocketAddress(host, port),
                          5000
                      );
                      socket.setSoTimeout(10000);
                      in = socket.getInputStream();
                      out = socket.getOutputStream();
                  }

                  // Keep the login method that was known to work with this RouterOS setup.
                  void login() throws Exception {
                      connect();

                      writeSentence("/login", new String[] {
                          "=name=" + user,
                          "=password=" + pass
                      });

                      ArrayList<String> response = readSentence();

                      for (String s : response) {
                          if (s.startsWith("!trap")) {
                              throw new IOException(s);
                          }
                      }
                  }

                  List<Map<String, String>> print(String cmd) throws Exception {
                      writeSentence(cmd, new String[0]);

                      List<Map<String, String>> rows = new ArrayList<>();

                      while (true) {
                          ArrayList<String> sentence = readSentence();
                          if (sentence.size() == 0) continue;

                          String type = sentence.get(0);

                          if ("!done".equals(type)) break;

                          if ("!re".equals(type)) {
                              Map<String, String> m = new HashMap<>();

                              for (String s : sentence) {
                                  if (s.startsWith("=")) {
                                      int q = s.indexOf('=', 1);
                                      if (q > 0) {
                                          m.put(
                                              s.substring(1, q),
                                              s.substring(q + 1)
                                          );
                                      }
                                  }
                              }

                              rows.add(m);
                          } else if ("!trap".equals(type)) {
                              throw new IOException(sentence.toString());
                          }
                      }

                      return rows;
                  }

                  void writeSentence(String cmd, String[] args) throws Exception {
                      writeWord(cmd);
                      for (String a : args) writeWord(a);
                      out.write(0);
                      out.flush();
                  }

                  void writeWord(String s) throws Exception {
                      byte[] b = s.getBytes(StandardCharsets.UTF_8);
                      writeLen(b.length);
                      out.write(b);
                  }

                  void writeLen(int n) throws Exception {
                      if (n < 0x80) {
                          out.write(n);
                      } else if (n < 0x4000) {
                          out.write((n >> 8) | 0x80);
                          out.write(n & 0xff);
                      } else if (n < 0x200000) {
                          out.write((n >> 16) | 0xc0);
                          out.write((n >> 8) & 0xff);
                          out.write(n & 0xff);
                      } else if (n < 0x10000000) {
                          out.write((n >> 24) | 0xe0);
                          out.write((n >> 16) & 0xff);
                          out.write((n >> 8) & 0xff);
                          out.write(n & 0xff);
                      } else {
                          out.write(0xf0);
                          out.write((n >> 24) & 0xff);
                          out.write((n >> 16) & 0xff);
                          out.write((n >> 8) & 0xff);
                          out.write(n & 0xff);
                      }
                  }

                  ArrayList<String> readSentence() throws Exception {
                      ArrayList<String> result = new ArrayList<>();

                      while (true) {
                          int len = readLen();
                          if (len == 0) break;

                          byte[] b = new byte[len];
                          int off = 0;

                          while (off < len) {
                              int r = in.read(b, off, len - off);
                              if (r < 0) throw new EOFException();
                              off += r;
                          }

                          result.add(new String(b, StandardCharsets.UTF_8));
                      }

                      return result;
                  }

                  int readLen() throws Exception {
                      int c = in.read();
                      if (c < 0) throw new EOFException();

                      if ((c & 0x80) == 0) return c;

                      if ((c & 0xc0) == 0x80) {
                          return ((c & 0x3f) << 8) | (in.read() & 255);
                      }

                      if ((c & 0xe0) == 0xc0) {
                          return ((c & 0x1f) << 16)
                              | ((in.read() & 255) << 8)
                              | (in.read() & 255);
                      }

                      if ((c & 0xf0) == 0xe0) {
                          return ((c & 0x0f) << 24)
                              | ((in.read() & 255) << 16)
                              | ((in.read() & 255) << 8)
                              | (in.read() & 255);
                      }

                      if (c == 0xf0) {
                          return (in.read() & 255) << 24
                              | (in.read() & 255) << 16
                              | (in.read() & 255) << 8
                              | (in.read() & 255);
                      }

                      throw new IOException("Invalid API length");
                  }

                  void close() {
                      try {
                          if (socket != null) socket.close();
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

