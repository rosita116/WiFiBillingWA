              boolean setIsolatedOnRouter(int index, boolean isolated) {
                  RouterApi api = null;
                  try {
                      String ip = get("mt_ip", "");
                      if (ip.isEmpty()) return false;

                      String username = get("c_" + index + "_ppp",
                          get("c_" + index + "_name", ""));
                      if (username.isEmpty()) return false;

                      api = new RouterApi(
                          ip,
                          Integer.parseInt(get("mt_port", "8728")),
                          get("mt_user", ""),
                          get("mt_pass", "")
                      );
                      api.login();

                      List<Map<String, String>> secrets =
                          api.print("/ppp/secret/print");

                      String secretId = null;
                      for (Map<String, String> s : secrets) {
                          if (username.equals(s.get("name"))) {
                              secretId = s.get(".id");
                              break;
                          }
                      }

                      if (secretId == null) {
                          api.close();
                          return false;
                      }

                      api.command("/ppp/secret/set", new String[] {
                          "=.id=" + secretId,
                          "=disabled=" + (isolated ? "yes" : "no")
                      });

                      // If isolating, immediately disconnect an active PPP session.
                      if (isolated) {
                          List<Map<String, String>> active =
                              api.print("/ppp/active/print");

                          for (Map<String, String> a : active) {
                              if (username.equals(a.get("name"))) {
                                  String activeId = a.get(".id");
                                  if (activeId != null) {
                                      api.command("/ppp/active/remove",
                                          new String[] {"=.id=" + activeId});
                                  }
                              }
                          }
                      }

                      api.close();
                      return true;
                  } catch (Exception e) {
                      if (api != null) api.close();
                      return false;
                  }
              }

