              @Override protected void onResume() {
                  super.onResume();

                  if (!get("mt_ip", "").isEmpty()) {
                      if (autoSync != null) handler.removeCallbacks(autoSync);

                      autoSync = new Runnable() {
                          @Override public void run() {
                              syncNow();
                              handler.postDelayed(this, 900000);
                          }
                      };

                      handler.postDelayed(autoSync, 900000);
                  }
              }

              @Override protected void onPause() {
                  super.onPause();
                  if (autoSync != null) {
                      handler.removeCallbacks(autoSync);
                  }
              }

              static class RouterApi {
                  Socket socket;
                  InputStream in;
                  OutputStream out;
                  String host, user, pass;
                  int port;

                  RouterApi(String h, int p, String u, String pw) {
                      host = h;
                      port = p;
                      user = u;
                      pass = pw;
                  }

                  void connect() throws Exception {
                      socket = new Socket();
                      socket.connect(
                          new InetSocketAddress(host, port),
                          5000
                      );
                      socket.setSoTimeout(10000);
                      in = socket.getInputStream();
                      out = socket.getOutputStream();
                  }

                  // Keep the login method that was known to work with this RouterOS setup.
                  void login() throws Exception {
                      connect();

                      writeSentence("/login", new String[] {
                          "=name=" + user,
                          "=password=" + pass
                      });

                      ArrayList<String> response = readSentence();

                      for (String s : response) {
                          if (s.startsWith("!trap")) {
                              throw new IOException(s);
                          }
                      }
                  }

                  List<Map<String, String>> print(String cmd) throws Exception {
                      writeSentence(cmd, new String[0]);

                      List<Map<String, String>> rows = new ArrayList<>();

                      while (true) {
                          ArrayList<String> sentence = readSentence();
                          if (sentence.size() == 0) continue;

                          String type = sentence.get(0);

                          if ("!done".equals(type)) break;

                          if ("!re".equals(type)) {
                              Map<String, String> m = new HashMap<>();

                              for (String s : sentence) {
                                  if (s.startsWith("=")) {
                                      int q = s.indexOf('=', 1);
                                      if (q > 0) {
                                          m.put(
                                              s.substring(1, q),
                                              s.substring(q + 1)
                                          );
                                      }
                                  }
                              }

                              rows.add(m);
                          } else if ("!trap".equals(type)) {
                              throw new IOException(sentence.toString());
                          }
                      }

                      return rows;
                  }

                  void command(String cmd, String[] args) throws Exception {
                      writeSentence(cmd, args);

                      while (true) {
                          ArrayList<String> sentence = readSentence();
                          if (sentence.size() == 0) continue;

                          String type = sentence.get(0);
                          if ("!done".equals(type)) return;
                          if ("!trap".equals(type)) {
                              throw new IOException(sentence.toString());
                          }
                      }
                  }

                  void writeSentence(String cmd, String[] args) throws Exception {
                      writeWord(cmd);
                      for (String a : args) writeWord(a);
                      out.write(0);
                      out.flush();
                  }

                  void writeWord(String s) throws Exception {
                      byte[] b = s.getBytes(StandardCharsets.UTF_8);
                      writeLen(b.length);
                      out.write(b);
                  }

                  void writeLen(int n) throws Exception {
                      if (n < 0x80) {
                          out.write(n);
                      } else if (n < 0x4000) {
                          out.write((n >> 8) | 0x80);
                          out.write(n & 0xff);
                      } else if (n < 0x200000) {
                          out.write((n >> 16) | 0xc0);
                          out.write((n >> 8) & 0xff);
                          out.write(n & 0xff);
                      } else if (n < 0x10000000) {
                          out.write((n >> 24) | 0xe0);
                          out.write((n >> 16) & 0xff);
                          out.write((n >> 8) & 0xff);
                          out.write(n & 0xff);
                      } else {
                          out.write(0xf0);
                          out.write((n >> 24) & 0xff);
                          out.write((n >> 16) & 0xff);
                          out.write((n >> 8) & 0xff);
                          out.write(n & 0xff);
                      }
                  }

                  ArrayList<String> readSentence() throws Exception {
                      ArrayList<String> result = new ArrayList<>();

                      while (true) {
                          int len = readLen();
                          if (len == 0) break;

                          byte[] b = new byte[len];
                          int off = 0;

                          while (off < len) {
                              int r = in.read(b, off, len - off);
                              if (r < 0) throw new EOFException();
                              off += r;
                          }

                          result.add(new String(b, StandardCharsets.UTF_8));
                      }

                      return result;
                  }

                  int readLen() throws Exception {
                      int c = in.read();
                      if (c < 0) throw new EOFException();

                      if ((c & 0x80) == 0) return c;

                      if ((c & 0xc0) == 0x80) {
                          return ((c & 0x3f) << 8) | (in.read() & 255);
                      }

                      if ((c & 0xe0) == 0xc0) {
                          return ((c & 0x1f) << 16)
                              | ((in.read() & 255) << 8)
                              | (in.read() & 255);
                      }

                      if ((c & 0xf0) == 0xe0) {
                          return ((c & 0x0f) << 24)
                              | ((in.read() & 255) << 16)
                              | ((in.read() & 255) << 8)
                              | (in.read() & 255);
                      }

                      if (c == 0xf0) {
                          return (in.read() & 255) << 24
                              | (in.read() & 255) << 16
                              | (in.read() & 255) << 8
                              | (in.read() & 255);
                      }

                      throw new IOException("Invalid API length");
                  }

                  void close() {
                      try {
                          if (socket != null) socket.close();
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF

