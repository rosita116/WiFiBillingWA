name: Build WiFi Billing APK v4 MikroTik

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/wifibilling/wa

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WiFiBillingWA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.wifibilling.wa'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.wifibilling.wa'
                  minSdk 23
                  targetSdk 34
                  versionCode 4
                  versionName '4.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="WiFi Billing WA"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/wifibilling/wa/MainActivity.java <<'EOF'
          package com.wifibilling.wa;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout root, list;
              android.content.SharedPreferences prefs;
              Handler handler = new Handler(Looper.getMainLooper());

              String get(String k, String d) {
                  return prefs.getString(k, d);
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("billing", MODE_PRIVATE);
                  showHome();
              }

              TextView title(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.DKGRAY);
                  t.setPadding(20,20,20,20);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  return b;
              }

              void base(String heading) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16,16,16,16);
                  root.addView(title(heading, 26));
                  setContentView(root);
              }

              void showHome() {
                  base("WiFi Billing WA");
                  TextView info = title(
                      "Billing pelanggan WiFi\\n\\nMikroTik: " +
                      (get("mt_ip","").isEmpty() ? "Belum dikonfigurasi" : get("mt_ip","")),
                      18);
                  root.addView(info);

                  Button sync = btn("🔄 Sinkronisasi MikroTik");
                  root.addView(sync);
                  sync.setOnClickListener(v -> syncNow());

                  Button settings = btn("⚙ Pengaturan MikroTik");
                  root.addView(settings);
                  settings.setOnClickListener(v -> showSettings());

                  Button customers = btn("👥 Daftar Pelanggan");
                  root.addView(customers);
                  customers.setOnClickListener(v -> showCustomers());

                  Button add = btn("➕ Tambah Pelanggan");
                  root.addView(add);
                  add.setOnClickListener(v -> addCustomer());

                  TextView note = title(
                      "Catatan: HP harus terhubung ke jaringan yang dapat mengakses IP MikroTik. " +
                      "Jangan membuka port API 8728 ke Internet umum.",
                      14);
                  root.addView(note);
              }

              void showSettings() {
                  base("Pengaturan MikroTik");

                  EditText ip = field("IP MikroTik", get("mt_ip","10.20.20.1"));
                  EditText port = field("Port API", get("mt_port","8728"));
                  EditText user = field("Username API", get("mt_user","billingapi"));
                  EditText pass = field("Password API", "");
                  pass.setInputType(129);

                  root.addView(ip); root.addView(port); root.addView(user); root.addView(pass);

                  Button save = btn("💾 Simpan & Tes Koneksi");
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      prefs.edit()
                          .putString("mt_ip", ip.getText().toString().trim())
                          .putString("mt_port", port.getText().toString().trim())
                          .putString("mt_user", user.getText().toString().trim())
                          .apply();

                      if (!pass.getText().toString().isEmpty())
                          prefs.edit().putString("mt_pass", pass.getText().toString()).apply();

                      new Thread(() -> {
                          try {
                              RouterApi api = new RouterApi(
                                  ip.getText().toString().trim(),
                                  Integer.parseInt(port.getText().toString().trim()),
                                  user.getText().toString().trim(),
                                  get("mt_pass",""));
                              api.login();
                              api.close();
                              runOnUiThread(() -> toast("Koneksi MikroTik BERHASIL"));
                          } catch(Exception e) {
                              runOnUiThread(() -> toast("Gagal koneksi: " + e.getMessage()));
                          }
                      }).start();
                  });

                  Button sync = btn("🔄 Sinkronisasi Sekarang");
                  root.addView(sync);
                  sync.setOnClickListener(v -> syncNow());

                  Button back = btn("← Kembali");
                  root.addView(back);
                  back.setOnClickListener(v -> showHome());
              }

              EditText field(String hint, String value) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setTextSize(17);
                  e.setPadding(12,12,12,12);
                  return e;
              }

              void addCustomer() {
                  base("Tambah Pelanggan");
                  EditText name = field("Nama pelanggan", "");
                  EditText wa = field("WhatsApp", "");
                  EditText ppp = field("Username PPPoE", "");
                  EditText pack = field("Paket / Profile", "");
                  EditText amount = field("Tagihan", "");
                  EditText due = field("Jatuh tempo", "");
                  root.addView(name);root.addView(wa);root.addView(ppp);
                  root.addView(pack);root.addView(amount);root.addView(due);

                  Button save = btn("💾 Simpan");
                  root.addView(save);
                  save.setOnClickListener(v -> {
                      String n=name.getText().toString().trim();
                      String u=ppp.getText().toString().trim();
                      if(n.isEmpty() || u.isEmpty()) { toast("Nama dan username PPPoE wajib diisi"); return; }
                      int count=prefs.getInt("count",0);
                      prefs.edit()
                          .putString("c_"+count+"_name",n)
                          .putString("c_"+count+"_wa",wa.getText().toString().trim())
                          .putString("c_"+count+"_ppp",u)
                          .putString("c_"+count+"_pack",pack.getText().toString().trim())
                          .putString("c_"+count+"_amount",amount.getText().toString().trim())
                          .putString("c_"+count+"_due",due.getText().toString().trim())
                          .putString("c_"+count+"_online","0")
                          .putInt("count",count+1).apply();
                      toast("Pelanggan disimpan");
                      showCustomers();
                  });
              }

              void showCustomers() {
                  base("Daftar Pelanggan");
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(list);
                  root.addView(sv, new LinearLayout.LayoutParams(-1,0,1));

                  int count=prefs.getInt("count",0);
                  if(count==0) list.addView(title("Belum ada pelanggan.",18));

                  for(int i=0;i<count;i++) {
                      String n=get("c_"+i+"_name","");
                      String p=get("c_"+i+"_ppp","");
                      String pack=get("c_"+i+"_pack","");
                      String amount=get("c_"+i+"_amount","0");
                      String due=get("c_"+i+"_due","-");
                      String online=get("c_"+i+"_online","0");

                      TextView t=title(
                          n+"\\nPPPoE: "+p+"\\nPaket: "+pack+
                          "\\nTagihan: "+amount+"\\nJatuh tempo: "+due+
                          "\\nStatus: "+(online.equals("1") ? "ONLINE" : "OFFLINE"),
                          17);
                      t.setBackgroundColor(0xffeeeeee);
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);
                      lp.setMargins(0,0,0,12);
                      list.addView(t,lp);
                  }

                  Button back=btn("← Kembali");
                  root.addView(back);
                  back.setOnClickListener(v -> showHome());
              }

              void syncNow() {
                  final String ip=get("mt_ip","");
                  if(ip.isEmpty()) { toast("Isi Pengaturan MikroTik dulu"); return; }

                  toast("Sinkronisasi dimulai...");
                  new Thread(() -> {
                      try {
                          RouterApi api=new RouterApi(ip,Integer.parseInt(get("mt_port","8728")),
                              get("mt_user",""),get("mt_pass",""));
                          api.login();
                          List<Map<String,String>> secrets=api.print("/ppp/secret/print");
                          List<Map<String,String>> active=api.print("/ppp/active/print");
                          api.close();

                          HashSet<String> online=new HashSet<>();
                          for(Map<String,String> a:active) {
                              String n=a.get("name");
                              if(n!=null) online.add(n);
                          }

                          int added=0, updated=0;
                          for(Map<String,String> s:secrets) {
                              String name=s.get("name");
                              if(name==null || name.isEmpty()) continue;
                              String profile=s.get("profile");
                              int idx=findCustomer(name);
                              if(idx<0) {
                                  idx=prefs.getInt("count",0);
                                  prefs.edit()
                                      .putString("c_"+idx+"_name",name)
                                      .putString("c_"+idx+"_wa","")
                                      .putString("c_"+idx+"_ppp",name)
                                      .putString("c_"+idx+"_pack",profile==null?"":profile)
                                      .putString("c_"+idx+"_amount","0")
                                      .putString("c_"+idx+"_due","-")
                                      .putString("c_"+idx+"_online",online.contains(name)?"1":"0")
                                      .putInt("count",idx+1).apply();
                                  added++;
                              } else {
                                  prefs.edit()
                                      .putString("c_"+idx+"_pack",profile==null?"":profile)
                                      .putString("c_"+idx+"_online",online.contains(name)?"1":"0")
                                      .apply();
                                  updated++;
                              }
                          }

                          final int a=added,b=updated;
                          runOnUiThread(() -> {
                              toast("Sinkronisasi selesai. Baru: "+a+" | Update: "+b);
                              showCustomers();
                          });
                      } catch(Exception e) {
                          runOnUiThread(() -> toast("Sinkronisasi gagal: "+e.getMessage()));
                      }
                  }).start();
              }

              int findCustomer(String ppp) {
                  int c=prefs.getInt("count",0);
                  for(int i=0;i<c;i++)
                      if(ppp.equals(get("c_"+i+"_ppp",""))) return i;
                  return -1;
              }

              void toast(String s) {
                  Toast.makeText(this,s,Toast.LENGTH_LONG).show();
              }

              @Override protected void onResume() {
                  super.onResume();
                  if(!get("mt_ip","").isEmpty()) {
                      handler.postDelayed(new Runnable() {
                          public void run() {
                              syncNow();
                              handler.postDelayed(this,900000);
                          }
                      },900000);
                  }
              }

              static class RouterApi {
                  Socket socket;
                  InputStream in; OutputStream out;
                  String host,user,pass; int port;

                  RouterApi(String h,int p,String u,String pw) {
                      host=h;port=p;user=u;pass=pw;
                  }

                  void connect() throws Exception {
                      socket=new Socket();
                      socket.connect(new InetSocketAddress(host,port),5000);
                      socket.setSoTimeout(10000);
                      in=socket.getInputStream(); out=socket.getOutputStream();
                  }

                  void login() throws Exception {
                      connect();

                      writeSentence("/login", new String[]{
                          "=name=" + user,
                          "=password=" + pass
                      });

                      ArrayList<String> response = 
                  readSentence();

                      for (String s : response) {
                          if (s.startsWith("!trap")) {
                              throw new IOException("Login 
                  MikroTik gagal: " + s);
                          }
                      }
                  }

                  List<Map<String,String>> print(String cmd) throws Exception {
                      writeSentence(cmd,new String[0]);
                      List<Map<String,String>> rows=new ArrayList<>();
                      ArrayList<String> sentence;
                      while(true) {
                          sentence=readSentence();
                          if(sentence.size()==0) continue;
                          String type=sentence.get(0);
                          if(type.equals("!done")) break;
                          if(type.equals("!re")) {
                              Map<String,String> m=new HashMap<>();
                              for(String s:sentence) {
                                  if(s.startsWith("=")) {
                                      int q=s.indexOf('=',1);
                                      if(q>0) m.put(s.substring(1,q),s.substring(q+1));
                                  }
                              }
                              rows.add(m);
                          } else if(type.equals("!trap")) {
                              throw new IOException(sentence.toString());
                          }
                      }
                      return rows;
                  }

                  void writeSentence(String cmd,String[] args) throws Exception {
                      writeWord(cmd);
                      for(String a:args) writeWord(a);
                      out.write(0); out.flush();
                  }

                  ArrayList<String> readSentence() throws Exception {
                      ArrayList<String> s=new ArrayList<>();
                      while(true) {
                          String w=readWord();
                          if(w.length()==0) break;
                          s.add(w);
                      }
                      return s;
                  }

                  void writeWord(String s) throws Exception {
                      byte[] b=s.getBytes(StandardCharsets.UTF_8);
                      writeLen(b.length); out.write(b);
                  }

                  String readWord() throws Exception {
                      int len=readLen();
                      if(len==0) return "";
                      byte[] b=new byte[len];
                      int off=0;
                      while(off<len) {
                          int n=in.read(b,off,len-off);
                          if(n<0) throw new EOFException();
                          off+=n;
                      }
                      return new String(b,StandardCharsets.UTF_8);
                  }

                  void writeLen(int n) throws Exception {
                      if(n<0x80) out.write(n);
                      else if(n<0x4000) { out.write((n>>8)|0x80); out.write(n&255); }
                      else if(n<0x200000) { out.write((n>>16)|0xC0); out.write((n>>8)&255); out.write(n&255); }
                      else if(n<0x10000000) { out.write((n>>24)|0xE0); out.write((n>>16)&255); out.write((n>>8)&255); out.write(n&255); }
                      else { out.write(0xF0); out.write((n>>24)&255); out.write((n>>16)&255); out.write((n>>8)&255); out.write(n&255); }
                  }

                  int readLen() throws Exception {
                      int c=in.read();
                      if(c<0) throw new EOFException();
                      if((c&0x80)==0) return c;
                      if((c&0xC0)==0x80) return ((c&0x3F)<<8)|(in.read()&255);
                      if((c&0xE0)==0xC0) return ((c&0x1F)<<16)|((in.read()&255)<<8)|(in.read()&255);
                      if((c&0xF0)==0xE0) return ((c&0x0F)<<24)|((in.read()&255)<<16)|((in.read()&255)<<8)|(in.read()&255);
                      if(c==0xF0) return (in.read()&255)<<24|(in.read()&255)<<16|(in.read()&255)<<8|(in.read()&255);
                      throw new IOException("Invalid API length");
                  }

                  void close() {
                      try { if(socket!=null) socket.close(); } catch(Exception ignored) {}
                  }

                  static byte[] md5HexBytes(String s) throws Exception {
                      java.security.MessageDigest md=java.security.MessageDigest.getInstance("MD5");
                      return md.digest(s.getBytes(StandardCharsets.UTF_8));
                  }

                  static String bytesHex(byte[] b) {
                      StringBuilder x=new StringBuilder();
                      for(byte v:b) x.append(String.format("%02x",v&255));
                      return x.toString();
                  }
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiBillingWA-v4-MikroTik-debug
          path: app/build/outputs/apk/debug/app-debug.apk
