name: Build NN-Net WiFi Billing APK v8 Isolir

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/wifibilling/wa
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WiFiBillingWA"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.wifibilling.wa'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.wifibilling.wa'
                  minSdk 23
                  targetSdk 34
                  versionCode 8
                  versionName '8.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="NN-Net WiFi Billing"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/wifibilling/wa/MainActivity.java <<'EOF'
          package com.wifibilling.wa;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;

          public class MainActivity extends Activity {
              LinearLayout root, list;
              SharedPreferences prefs;
              Handler handler = new Handler(Looper.getMainLooper());
              Runnable autoSync;

              String get(String k, String d) {
                  return prefs.getString(k, d);
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("billing", MODE_PRIVATE);
                  showHome();
              }

              TextView title(String s, int size) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.DKGRAY);
                  t.setPadding(20, 20, 20, 20);
                  return t;
              }

              Button btn(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  return b;
              }
              void base(String heading) {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xfff5f2fb);

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(8, 8, 8, 8);

                  TextView back = ui6Text("‹", 34, 0xff3b247e, false);
                  back.setGravity(Gravity.CENTER);
                  back.setOnClickListener(v -> showHome());
                  header.addView(back, new LinearLayout.LayoutParams(48, 52));

                  TextView h = ui6Text(heading, 21, 0xff2f2459, true);
                  header.addView(h, new LinearLayout.LayoutParams(0, 52, 1));

                  root.addView(header);
                  setContentView(root);
              }
              void showHome() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xfff6f3fc);

                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(12, 0, 12, 18);

                  ScrollView sv = new ScrollView(this);
                  sv.setFillViewport(true);
                  sv.addView(content);
                  root.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1));

                  // HERO
                  LinearLayout hero = new LinearLayout(this);
                  hero.setOrientation(LinearLayout.VERTICAL);
                  hero.setPadding(18, 18, 18, 18);
                  GradientDrawable heroBg = new GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      new int[]{0xff4520b5, 0xff8650eb}
                  );
                  heroBg.setCornerRadius(28);
                  hero.setBackground(heroBg);

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);

                  TextView logo = ui7Text("NN", 18, 0xff5b2dcc, true);
                  logo.setGravity(Gravity.CENTER);
                  logo.setBackground(ui7Bg(Color.WHITE, 18));
                  top.addView(logo, new LinearLayout.LayoutParams(54, 54));

                  LinearLayout brand = new LinearLayout(this);
                  brand.setOrientation(LinearLayout.VERTICAL);
                  brand.setPadding(12, 0, 8, 0);
                  brand.addView(ui7Text("NN-NET", 22, Color.WHITE, true));
                  brand.addView(ui7Text("WiFi Billing", 16, Color.WHITE, true));
                  brand.addView(ui7Text("Kelola Pelanggan WiFi Lebih Mudah", 12, 0xffeee8ff, false));
                  top.addView(brand, new LinearLayout.LayoutParams(0, -2, 1));

                  TextView bell = ui7Text("●", 18, Color.WHITE, true);
                  bell.setGravity(Gravity.CENTER);
                  top.addView(bell, new LinearLayout.LayoutParams(42, 54));
                  hero.addView(top);

                  TextView mt = ui7Text(
                      get("mt_ip", "").isEmpty()
                          ? "●  MikroTik belum dikonfigurasi"
                          : "●  MikroTik   " + get("mt_ip", ""),
                      13, 0xfff2edff, false
                  );
                  mt.setPadding(66, 10, 0, 0);
                  hero.addView(mt);
                  content.addView(hero);

                  ui7Gap(content, 12);

                  int count = prefs.getInt("count", 0);
                  int online = 0, paid = 0, offline = 0;
                  long total = 0;

                  for (int i = 0; i < count; i++) {
                      if ("1".equals(get("c_" + i + "_online", "0"))) online++;
                      else offline++;
                      if ("1".equals(get("c_" + i + "_paid", "0"))) paid++;
                      try {
                          total += Long.parseLong(
                              get("c_" + i + "_amount", "0").replaceAll("[^0-9]", "")
                          );
                      } catch (Exception ignored) {}
                  }

                  // STATS: 2 x 2 so nothing is squeezed or clipped on narrow phones.
                  LinearLayout statsRow1 = new LinearLayout(this);
                  statsRow1.setOrientation(LinearLayout.HORIZONTAL);
                  ui7Stat(statsRow1, "♙", "Total Pelanggan", String.valueOf(count), 0xfff1ebff);
                  ui7Stat(statsRow1, "●", "Online", String.valueOf(online), 0xffe9f9f1);
                  content.addView(statsRow1);

                  ui7Gap(content, 8);

                  LinearLayout statsRow2 = new LinearLayout(this);
                  statsRow2.setOrientation(LinearLayout.HORIZONTAL);
                  ui7Stat(statsRow2, "○", "Offline", String.valueOf(offline), 0xffedf1ff);
                  ui7Stat(statsRow2, "✓", "Lunas", String.valueOf(paid), 0xfffff2df);
                  content.addView(statsRow2);

                  ui7Gap(content, 12);

                  // BILLING SUMMARY
                  LinearLayout bill = ui7Card();
                  bill.setPadding(16, 16, 16, 16);

                  LinearLayout billTop = new LinearLayout(this);
                  billTop.setGravity(Gravity.CENTER_VERTICAL);

                  TextView billIcon = ui7Text("Rp", 14, Color.WHITE, true);
                  billIcon.setGravity(Gravity.CENTER);
                  billIcon.setBackground(ui7Bg(0xff6b3ddd, 18));
                  billTop.addView(billIcon, new LinearLayout.LayoutParams(46, 46));

                  LinearLayout billText = new LinearLayout(this);
                  billText.setOrientation(LinearLayout.VERTICAL);
                  billText.setPadding(12, 0, 8, 0);
                  billText.addView(ui7Text("Tagihan Bulan Ini", 17, 0xff24204b, true));
                  billText.addView(ui7Text(
                      Math.max(0, count - paid) + " pelanggan belum membayar",
                      12, 0xff77738c, false
                  ));
                  billTop.addView(billText, new LinearLayout.LayoutParams(0, -2, 1));

                  TextView sum = ui7Text("Rp " + ui6Money(total), 13, Color.WHITE, true);
                  sum.setGravity(Gravity.CENTER);
                  sum.setPadding(13, 9, 13, 9);
                  sum.setBackground(ui7Bg(0xff5b2dcc, 22));
                  billTop.addView(sum);

                  bill.addView(billTop);
                  content.addView(bill);

                  // MENU UTAMA — 3 x 2, lebih lega seperti desain NN-NET
                  TextView menuTitle = ui7Text("Menu Utama", 20, 0xff24204b, true);
                  menuTitle.setPadding(2, 18, 2, 10);
                  content.addView(menuTitle);

                  LinearLayout menu1 = new LinearLayout(this);
                  menu1.setOrientation(LinearLayout.HORIZONTAL);
                  ui7Menu(menu1, "♙", "Pelanggan", "Kelola pelanggan",
                      v -> showCustomers(), 0xffeee8ff);
                  ui7Menu(menu1, "▣", "Penagihan", "Proses tagihan",
                      v -> showBilling(), 0xffeaf1ff);
                  ui7Menu(menu1, "⌁", "MikroTik", "Kelola router",
                      v -> showSettings(), 0xffe8f8f5);
                  content.addView(menu1);

                  ui7Gap(content, 8);

                  LinearLayout menu2 = new LinearLayout(this);
                  menu2.setOrientation(LinearLayout.HORIZONTAL);
                  ui7Menu(menu2, "⚙", "Pengaturan", "Atur aplikasi",
                      v -> showSettings(), 0xffffedf2);
                  ui7Menu(menu2, "🔒", "Isolir", "Blokir / Unblock",
                      v -> showIsolir(), 0xffffefd9);
                  ui7Menu(menu2, "+", "Tambah", "Pelanggan baru",
                      v -> addCustomer(), 0xffeee8ff);
                  content.addView(menu2);

                  // RECENT BILLING
                  LinearLayout recent = ui7Card();
                  recent.setPadding(16, 16, 16, 12);

                  LinearLayout rt = new LinearLayout(this);
                  rt.setGravity(Gravity.CENTER_VERTICAL);
                  rt.addView(ui7Text("Tagihan Terbaru", 18, 0xff24204b, true),
                      new LinearLayout.LayoutParams(0, -2, 1));
                  TextView all = ui7Text("Lihat Semua  ›", 12, 0xff5b2dcc, true);
                  all.setGravity(Gravity.CENTER);
                  all.setPadding(10, 7, 10, 7);
                  all.setBackground(ui7Bg(0xfff0ebff, 18));
                  all.setOnClickListener(v -> showBilling());
                  rt.addView(all);
                  recent.addView(rt);

                  int shown = 0;
                  for (int i = 0; i < count && shown < 4; i++) {
                      String n = get("c_" + i + "_name", "");
                      if (n.isEmpty()) continue;

                      String amount = get("c_" + i + "_amount", "0");
                      String due = get("c_" + i + "_due", "-");
                      boolean isPaid = "1".equals(get("c_" + i + "_paid", "0"));
                      String paidText = isPaid ? "Lunas" : "Belum Bayar";

                      LinearLayout rr = new LinearLayout(this);
                      rr.setGravity(Gravity.CENTER_VERTICAL);
                      rr.setPadding(0, 12, 0, 12);

                      TextView av = ui7Text("♙", 19, 0xff5b2dcc, false);
                      av.setGravity(Gravity.CENTER);
                      av.setBackground(ui7Bg(0xffeee8ff, 24));
                      rr.addView(av, new LinearLayout.LayoutParams(44, 44));

                      LinearLayout ri = new LinearLayout(this);
                      ri.setOrientation(LinearLayout.VERTICAL);
                      ri.setPadding(10, 0, 8, 0);
                      ri.addView(ui7Text(n, 14, 0xff24204b, true));
                      ri.addView(ui7Text("Jatuh tempo: " + due + "  •  Rp " + amount,
                          11, 0xff77738c, false));
                      rr.addView(ri, new LinearLayout.LayoutParams(0, -2, 1));

                      TextView badge = ui7Text(paidText, 10,
                          isPaid ? 0xff148b61 : 0xffd77a00, true);
                      badge.setGravity(Gravity.CENTER);
                      badge.setPadding(10, 8, 10, 8);
                      badge.setBackground(ui7Bg(
                          isPaid ? 0xffdff7ed : 0xffffefd7, 18));
                      rr.addView(badge);

                      recent.addView(rr);
                      shown++;
                  }
                  content.addView(recent);

                  ui7Gap(content, 10);
                  TextView foot = ui7Text("NN-NET  •  MikroTik  •  WiFi  •  Billing", 11, 0xff888398, false);
                  foot.setGravity(Gravity.CENTER);
                  content.addView(foot);
                  ui7Gap(content, 8);

                  ui6BottomNav(root, 0);
                  setContentView(root);
              }
